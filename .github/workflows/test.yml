name: Check skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check scripts
        run: |
          node --check scripts/setup.mjs
          python -m py_compile scripts/transcribe.py
      - name: Build installable package
        run: python tools/package_skill.py
      - name: Check committed package matches source
        run: git diff --exit-code -- dist/teable-video-editor.skill
      - name: Check package reproducibility
        run: |
          cp dist/teable-video-editor.skill /tmp/first.skill
          python tools/package_skill.py
          cmp /tmp/first.skill dist/teable-video-editor.skill
      - uses: actions/upload-artifact@v4
        with:
          name: teable-video-editor-skill
          path: dist/teable-video-editor.skill
